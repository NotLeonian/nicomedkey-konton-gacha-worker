version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      prettier:
        applies-to: version-updates
        patterns:
          - prettier
          - prettier-plugin-sql-cst
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
