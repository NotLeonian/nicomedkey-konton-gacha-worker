name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci
      - name: Check lint and formatting with Biome
        run: npm run check:biome
      - name: Check formatter dependency versions and formatting
        run: npm run check:prettier
      - name: Check TypeScript types
        run: npm run typecheck
      - name: Run tests
        run: npm test
